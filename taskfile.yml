# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  server:
    desc: Run the API server with hot reload using air
    cmds:
      - air -c air.toml

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  mocks:
    desc: Generate mocks for all interfaces
    cmds:
      - mockery

  test:
    desc: Run all tests
    cmds:
      - go test -v -race ./...

  build:server:
    desc: Build the server binary with version injected
    cmds:
      - go build -ldflags="-X main.version=$(git describe --always --abbrev=7 --dirty 2>/dev/null || echo dev)" -o bin/app ./cmd/server

  build:
    desc: Build all binaries
    deps: [build:server]

  new:module:
    desc: Scaffold a new business module
    cmds:
      - go run scripts/generator/main.go {{.name}}
    vars:
      name: '{{default "mymodule" .name}}'

  docs:generate:
    desc: OpenAPI spec is built programmatically at runtime (no generation needed)
    cmds:
      - echo "OpenAPI spec is built programmatically. Run the server and visit /docs/."

  check:
    desc: Run format, lint, test, and tidy
    cmds:
      - task: format
      - task: lint
      - task: test
      - task: tidy

  test-integration:
    desc: Run integration tests (requires build tag)
    cmds:
      - go test -v -race -tags=integration ./internal/...

  format:
    desc: Format all Go files using gofmt
    cmds:
      - gofmt -w .

  tidy:
    desc: Clean up and sync go modules
    cmds:
      - go mod tidy
      - go mod verify

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/
      - rm -rf tmp/

  migrate:
    desc: Run database migrations
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@latest -dir internal/outbound/database/migrations postgres "host=${DB_HOST:-localhost} port=${DB_PORT:-5432} user=${DB_USERNAME:-gokit_starter} password=${DB_PASSWORD:-secret} dbname=${DB_DATABASE:-gokit_starter} sslmode=disable" up

  migrate:rollback:
    desc: Rollback the last database migration
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@latest -dir internal/outbound/database/migrations postgres "host=${DB_HOST:-localhost} port=${DB_PORT:-5432} user=${DB_USERNAME:-gokit_starter} password=${DB_PASSWORD:-secret} dbname=${DB_DATABASE:-gokit_starter} sslmode=disable" down

  make:migration:
    desc: Create a new database migration file
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@latest -dir internal/outbound/database/migrations create {{.name}} sql
    vars:
      name: '{{default "new_migration" .name}}'
