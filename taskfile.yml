# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  server:
    desc: Run the API server with hot reload using air
    cmds:
      - air -c air.toml

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  mocks:
    desc: Generate mocks for all interfaces
    cmds:
      - mockery

  test:
    desc: Run all tests
    cmds:
      - go test -v -race ./...

  build:server:
    desc: Build the server binary
    cmds:
      - go build -o bin/app ./cmd/server

  build:
    desc: Build all binaries
    deps: [build:server]

  generate:
    desc: Regenerate Ent code from schema definitions
    cmds:
      - go generate ./internal/database/ent/...

  db:diff:
    desc: Generate a new migration file
    deps: [db:clean]
    cmds:
      - go run -mod=mod internal/database/ent/migrate/tool/main.go {{.name}}
    vars:
      name: '{{default "migration" .name}}'

  db:clean:
    desc: Reset the database to a clean state
    cmds:
      - docker compose down -v
      - docker compose up -d
      - sleep 5

  db:migrate:
    desc: Apply all pending migrations
    cmds:
      - atlas migrate apply --dir "file://database/migrations" --url "postgres://{{.DB_USER}}:{{.DB_PASS}}@{{.DB_HOST}}:{{.DB_PORT}}/{{.DB_NAME}}?sslmode=disable"
    vars:
      DB_USER: '{{default "gokit_starter" .DB_USER}}'
      DB_PASS: '{{default "secret" .DB_PASS}}'
      DB_HOST: '{{default "127.0.0.1" .DB_HOST}}'
      DB_PORT: '{{default "5432" .DB_PORT}}'
      DB_NAME: '{{default "gokit_starter" .DB_NAME}}'

  docs:generate:
    desc: Generate Swagger/OpenAPI docs
    cmds:
      - swag init -g cmd/server/main.go -o docs --parseInternal --parseDependency

  format:
    desc: Format all Go files using gofmt
    cmds:
      - gofmt -w .

  tidy:
    desc: Clean up and sync go modules
    cmds:
      - go mod tidy
      - go mod verify

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/
      - rm -rf tmp/
      - rm -f viz.dot

  viz:
    desc: Generate dependency graph visualization
    cmds:
      - go run cmd/server/main.go viz > viz.dot
      - echo "Dependency graph saved to viz.dot. Paste content to edotor.net to visualize."
