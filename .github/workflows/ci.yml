name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          args: --timeout=10m

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gokit_starter
          POSTGRES_USER: gokit_starter
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Atlas CLI
        run: |
          curl -sSf https://atlasgo.sh | sh
          echo "$HOME/.atlas" >> $GITHUB_PATH

      - name: Run Migrations
        run: task db:migrate
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gokit_starter
          DB_USER: gokit_starter
          DB_PASS: secret

      - name: Run Tests
        run: task test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gokit_starter
          DB_USER: gokit_starter
          DB_PASS: secret
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          AUTH_JWT_SECRET: ci-secret-key-at-least-32-chars-long-!!!
