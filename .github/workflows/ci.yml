name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - "**/*.go"
      - "**/*.yaml"
      - "**/*.yml"
      - "go.mod"
      - "go.sum"
      - "Taskfile.yml"
      - "lefthook.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "**/*.go"
      - "**/*.yaml"
      - "**/*.yml"
      - "go.mod"
      - "go.sum"
      - "Taskfile.yml"
      - "lefthook.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: binary

  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run tests with coverage
        run: go test -race -tags=integration -coverprofile=coverage.out ./...
        env:
          AUTH_JWT_SECRET: ci-secret-key-at-least-32-chars-long-!!!

  govulncheck:
    name: Govulncheck
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
